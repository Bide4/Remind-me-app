<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <link rel="manifest" href="manifest.json">

  <title>RemindMe</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.75;
      font-size: 14px;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .action {
      background: white;
      border-radius: 18px;
      padding: 18px 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      cursor: pointer;
    }

    .action:active {
      transform: scale(0.97);
    }

    .action .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .action p {
      font-size: 13px;
      font-weight: bold;
    }

    .section-title {
      margin: 28px 0 12px;
      font-size: 19px;
    }

    .item-card {
      background: white;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .item-title {
      font-size: 17px;
      font-weight: bold;
    }

    .item-info {
      margin-top: 7px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty {
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .empty .big-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 25px 25px 0 0;
      padding: 25px 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .save {
      background: #111827;
      color: white;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      border-top: 1px solid #e5e7eb;
      z-index: 10;
    }

    .nav-item {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-item .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 3px;
    }

    .active {
      color: #111827;
      font-weight: bold;
    }

    @media (min-width: 601px) {
      body {
        max-width: 600px;
        margin: auto;
      }

      .bottom-nav {
        max-width: 600px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>RemindMe</h1>
  <p>Your day, organized.</p>
</header>

<div class="container">

  <div class="quick-actions">

    <div class="action" onclick="openAlarmModal()">
      <div class="icon">⏰</div>
      <p>Alarm</p>
    </div>

    <div class="action" onclick="openReminderModal()">
      <div class="icon">🔔</div>
      <p>Reminder</p>
    </div>

    <div class="action" onclick="comingSoon('Event')">
      <div class="icon">📅</div>
      <p>Event</p>
    </div>

  </div>

  <h2 class="section-title">My Alarms</h2>

  <div id="alarmList"></div>

  <h2 class="section-title">My Reminders</h2>

  <div id="reminderList"></div>

</div>


<!-- ALARM MODAL -->

<div class="modal" id="alarmModal">

  <div class="modal-content">

    <h2>⏰ New Alarm</h2>

    <div class="input-group">
      <label>Alarm time</label>
      <input type="time" id="alarmTime">
    </div>

    <div class="input-group">
      <label>Alarm name</label>
      <input
        type="text"
        id="alarmName"
        placeholder="e.g. Wake up"
      >
    </div>

    <div class="buttons">

      <button
        class="btn cancel"
        onclick="closeAlarmModal()">
        Cancel
      </button>

      <button
        class="btn save"
        onclick="saveAlarm()">
        Save Alarm
      </button>

    </div>

  </div>

</div>


<!-- REMINDER MODAL -->

<div class="modal" id="reminderModal">

  <div class="modal-content">

    <h2>🔔 New Reminder</h2>

    <div class="input-group">

      <label>Reminder title</label>

      <input
        type="text"
        id="reminderTitle"
        placeholder="e.g. Call Mum"
      >

    </div>

    <div class="input-group">

      <label>Date</label>

      <input
        type="date"
        id="reminderDate"
      >

    </div>

    <div class="input-group">

      <label>Time</label>

      <input
        type="time"
        id="reminderTime"
      >

    </div>

    <div class="buttons">

      <button
        class="btn cancel"
        onclick="closeReminderModal()">
        Cancel
      </button>

      <button
        class="btn save"
        onclick="saveReminder()">
        Save Reminder
      </button>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-item active">
    <span class="nav-icon">🏠</span>
    Home
  </div>

  <div
    class="nav-item"
    onclick="openAlarmModal()">

    <span class="nav-icon">⏰</span>
    Alarms

  </div>

  <div
    class="nav-item"
    onclick="openReminderModal()">

    <span class="nav-icon">🔔</span>
    Reminders

  </div>

  <div
    class="nav-item"
    onclick="comingSoon('Event')">

    <span class="nav-icon">📅</span>
    Events

  </div>

</nav>


<script>

  /* =========================
     ALARMS
  ========================= */

  let alarms = JSON.parse(
    localStorage.getItem("remindme_alarms")
  ) || [];


  function openAlarmModal() {

    document.getElementById(
      "alarmModal"
    ).style.display = "flex";

  }


  function closeAlarmModal() {

    document.getElementById(
      "alarmModal"
    ).style.display = "none";

    document.getElementById(
      "alarmTime"
    ).value = "";

    document.getElementById(
      "alarmName"
    ).value = "";

  }


  function saveAlarm() {

    const time =
      document.getElementById(
        "alarmTime"
      ).value;

    const name =
      document.getElementById(
        "alarmName"
      ).value.trim() || "Alarm";


    if (!time) {

      alert(
        "Please choose an alarm time."
      );

      return;

    }


    alarms.push({

      id: Date.now(),

      time: time,

      name: name,

      enabled: true

    });


    localStorage.setItem(

      "remindme_alarms",

      JSON.stringify(alarms)

    );


    closeAlarmModal();

    displayAlarms();

  }


  function toggleAlarm(id) {

    alarms = alarms.map(alarm => {

      if (alarm.id === id) {

        alarm.enabled =
          !alarm.enabled;

      }

      return alarm;

    });


    localStorage.setItem(

      "remindme_alarms",

      JSON.stringify(alarms)

    );


    displayAlarms();

  }


  function deleteAlarm(id) {

    alarms = alarms.filter(

      alarm => alarm.id !== id

    );


    localStorage.setItem(

      "remindme_alarms",

      JSON.stringify(alarms)

    );


    displayAlarms();

  }


  function displayAlarms() {

    const list =
      document.getElementById(
        "alarmList"
      );


    if (alarms.length === 0) {

      list.innerHTML = `

        <div class="empty">

          <div class="big-icon">
            ⏰
          </div>

          <p>
            No alarms yet.
          </p>

          <br>

          <small>
            Tap Alarm above to create one.
          </small>

        </div>

      `;

      return;

    }


    alarms.sort((a,b) =>
      a.time.localeCompare(b.time)
    );


    list.innerHTML =
      alarms.map(alarm => `

        <div class="item-card">

          <div class="item-top">

            <div>

              <div class="item-title">
                ${formatTime(alarm.time)}
              </div>

              <div class="item-info">
                ${escapeHTML(alarm.name)}
              </div>

            </div>


            <div>

              <button
                class="delete-btn"
                onclick="deleteAlarm(${alarm.id})">

                ×

              </button>

            </div>

          </div>

        </div>

      `).join("");

  }


  /* =========================
     REMINDERS
  ========================= */

  let reminders = JSON.parse(

    localStorage.getItem(
      "remindme_reminders"
    )

  ) || [];


  function openReminderModal() {

    document.getElementById(
      "reminderModal"
    ).style.display = "flex";

  }


  function closeReminderModal() {

    document.getElementById(
      "reminderModal"
    ).style.display = "none";


    document.getElementById(
      "reminderTitle"
    ).value = "";


    document.getElementById(
      "reminderDate"
    ).value = "";


    document.getElementById(
      "reminderTime"
    ).value = "";

  }


  function saveReminder() {

    const title =
      document.getElementById(
        "reminderTitle"
      ).value.trim();


    const date =
      document.getElementById(
        "reminderDate"
      ).value;


    const time =
      document.getElementById(
        "reminderTime"
      ).value;


    if (!title) {

      alert(
        "Please enter a reminder title."
      );

      return;

    }


    if (!date) {

      alert(
        "Please choose a date."
      );

      return;

    }


    if (!time) {

      alert(
        "Please choose a time."
      );

      return;

    }


    reminders.push({

      id: Date.now(),

      title: title,

      date: date,

      time: time

    });


    localStorage.setItem(

      "remindme_reminders",

      JSON.stringify(reminders)

    );


    closeReminderModal();

    displayReminders();

  }


  function deleteReminder(id) {

    reminders =
      reminders.filter(

        reminder =>
          reminder.id !== id

      );


    localStorage.setItem(

      "remindme_reminders",

      JSON.stringify(reminders)

    );


    displayReminders();

  }


  function displayReminders() {

    const list =
      document.getElementById(
        "reminderList"
      );


    if (reminders.length === 0) {

      list.innerHTML = `

        <div class="empty">

          <div class="big-icon">
            🔔
          </div>

          <p>
            No reminders yet.
          </p>

          <br>

          <small>
            Tap Reminder above to create one.
          </small>

        </div>

      `;

      return;

    }


    reminders.sort((a,b) => {

      const first =
        a.date + " " + a.time;

      const second =
        b.date + " " + b.time;

      return first.localeCompare(second);

    });


    list.innerHTML =
      reminders.map(reminder => `

        <div class="item-card">

          <div class="item-top">

            <div>

              <div class="item-title">

                ${escapeHTML(
                  reminder.title
                )}

              </div>

              <div class="item-info">

                📅 ${formatDate(
                  reminder.date
                )}

                <br>

                ⏰ ${formatTime(
                  reminder.time
                )}

              </div>

            </div>


            <button
              class="delete-btn"
              onclick="deleteReminder(${reminder.id})">

              ×

            </button>

          </div>

        </div>

      `).join("");

  }


  /* =========================
     HELPERS
  ========================= */

  function formatTime(time) {

    const [hour, minute] =
      time.split(":");


    const date =
      new Date();


    date.setHours(hour);

    date.setMinutes(minute);


    return date.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  function formatDate(dateString) {

    const date =
      new Date(
        dateString + "T00:00:00"
      );


    return date.toLocaleDateString(
      [],
      {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );

  }


  function escapeHTML(text) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent = text;


    return div.innerHTML;

  }


  function comingSoon(feature) {

    alert(
      feature +
      " feature is coming next!"
    );

  }


  /* =========================
     START APP
  ========================= */

  displayAlarms();

  displayReminders();


  /* SERVICE WORKER */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker.register(
          "./service-worker.js"
        );

      }
    );

  }

</script>

</body>
  </html>
